  /api/cms/hero-banners:
    get:
      tags:
      - CMS Hero Banners
      operationId: listBanners
      summary: List banners by active state and status
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ArticleStatus'
      - name: fromDate
        in: query
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBanners'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-design-status: proposed
      description: ' Pagination uses optional limit (default=10, clamp to [5,100]) and 1-based page (default=1). Empty list returns HTTP 200 with an empty array.'
    post:
      tags:
      - CMS Hero Banners
      operationId: createBanner
      summary: Create new banner as draft or publish immediately
      description: The banner status indicates Save draft or Publish. Published active banners can be updated only by Publish. Publishing a new banner atomically deactivates the old displayed banner. For a new draft, publishedAt=null; initial Publish sets publishedAt to the current timestamp. The replaced published banner becomes isActive=false, status=null, publishedAt=null within the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeroBannerInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeroBanner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
  /api/cms/hero-banners/{id}:
    get:
      tags:
      - CMS Hero Banners
      operationId: getBanner
      summary: Get banner for editing
      parameters:
      - $ref: '#/components/parameters/BannerId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeroBanner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
    put:
      tags:
      - CMS Hero Banners
      operationId: updateBanner
      summary: Update banner as draft or publish
      description: The banner status indicates Save draft or Publish. Published active banners can be updated only by Publish. Publishing a new banner atomically deactivates the old displayed banner. Publishing an already published active record preserves its publishedAt timestamp. If another banner was visible, it is atomically deactivated with status=null and publishedAt=null.
      parameters:
      - $ref: '#/components/parameters/BannerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeroBannerInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeroBanner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
    patch:
      tags:
      - CMS Hero Banners
      operationId: restoreBanner
      summary: Reactivate hero banner as draft
      description: Sets isActive=true and status=draft; does not appear publicly until Publish. Response is the complete flat resource, not wrapped. publishedAt is null on restoration.
      parameters:
      - $ref: '#/components/parameters/BannerId'
      responses:
        '200':
          description: Complete, flat banner restored as active draft (status=draft, publishedAt=null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeroBanner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
    delete:
      tags:
      - CMS Hero Banners
      operationId: deactivateBanner
      summary: Deactivate hero banner
      parameters:
      - $ref: '#/components/parameters/BannerId'
      responses:
        '200':
          description: Banner inactive; if this was the displayed banner the homepage has none
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                required:
                - success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
      description: Deactivation sets isActive=false, status=null, publishedAt=null.
