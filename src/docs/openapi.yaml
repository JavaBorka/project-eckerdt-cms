openapi: 3.1.1
info:
  title: Custom CMS API — Mentoring Contract Draft
  version: 0.6.4
  description: 'Framework-independent API contract for a React/TypeScript CMS with a Node.js backend.


    Mentor-agreed updates (2026-11-08): GET CMS articles accepts limit (default 10; clamps requests below 5 to 5 and above 100 to 100), returns articles instead of items and pageSize as the applied size; default sort newest; list returns 200 even with no matches. Create/update requests use unwrapped article properties with a nested preview and desired draft/published status. Backend generates article ID, timestamps and initial isActive. Article and preview are stored/published atomically. DELETE deactivates and clears status and publishedAt; PATCH on /{id} restores status=draft and isActive=true while publishedAt stays null. Categories use integer IDs; protected Unknown category is -1. Hero banners use corresponding create/update and restore conventions. Media is registered by external URL, not uploaded as binary through the CMS API; media ID/fileName/mediaType/url are returned. Public media is readable by ID.


    Security limitation: MVP has no login. CMS management routes MUST be restricted to trusted development/network access, never exposed as unauthenticated public write routes.


    Remaining mentor discussions are explicitly tracked via info.x-open-questions. Exact Plate document structure remains unchanged from v0.2.0.


    Updates in v0.4.0: all resource identifiers and media references are integers; Article mainImageId is required for both Save draft and Publish; CMS article listing puts articles before pagination fields; hero banner listing uses banners (not items). CMS hero banners and media use the same limit (default 10, clamp 5–100) / pageSize convention. Categories remain unpaginated. Prior Plate content schema and lifecycle behavior are preserved.


    Updates in v0.5.0: CMS Authors management (unpaginated) with numeric IDs, protected Unknown author id=-1, case-insensitive name uniqueness after trimming leading/trailing whitespace. Deleting an author reassigns referenced articles to Unknown atomically. Article requests and CMS responses use authorId instead of the free-text author field; public article cards and public article detail responses expose authorId and resolved authorName. No public authors endpoint; About the Author remains static in React.


    Updates in v0.6.0 (2026-11-15): PATCH restore paths are now /api/cms/articles/{id} and /api/cms/hero-banners/{id}; request remains RestoreRequest, response returns a flat full Article or HeroBanner without an envelope. Inactive resources have status=null and publishedAt=null; restore sets status=draft, isActive=true, publishedAt=null. Publishing sets publishedAt once per activation cycle; subsequent edits/publishes preserve it. When publishing a new banner, the previously visible banner is atomically deactivated and its status and publishedAt cleared. Category.isSystem is required. VARCHAR-aligned string limits are specified via maxLength. Pagination, PlateContent, and unrelated routes remain unchanged.

    '
  x-open-questions:
  - Backend framework is not selected; PostgreSQL is the planned database.
  - External media provider (Firebase or another) and URL trust/access policy not selected.
  - 'Media ID generation: proposed backend-generated identifier; confirm with mentor.'
  - Media URL and format/size rules, provider validation and whether remote URL can be deleted are unresolved.
  - Error JSON details remain provisional (ErrorDraft schema); codes limited to 200/201/400/404 where applicable.
  - Plate editor JSON node/block structure remains intentionally open and unchanged.
  - Whether article-slug changes should trigger frontend canonical navigation is open; redirects explicitly not required.
  - For media still referenced by content, a rejected deletion uses 400 under agreed code set; error body is provisional.
  - Empty public hero banner response is 200 with null banner instead of 204 to match agreed status-code set; confirm with mentor if desired.
  - Exact implementation of Unicode case-insensitive author name uniqueness and whitespace normalization is database-specific; contract requires trimming and case-insensitive comparison.
servers:
- url: http://localhost:8080
  description: Example local development server; address/port to confirm
  x-design-status: proposed
security: []
tags:
- name: CMS Articles
- name: CMS Categories
- name: CMS Authors
- name: CMS Hero Banners
- name: CMS Media
- name: Public Content
components:
  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      description: Numeric article identifier, e.g. 12 in /articles/12-my-article.
      schema:
        type: integer
        description: Numeric article ID used in /articles/{id}-{slug}.
    CategoryId:
      name: id
      in: path
      required: true
      description: Numeric category identifier; -1 denotes protected Unknown category.
      schema:
        type: integer
        description: Numeric category ID; -1 is the protected Unknown category.
    BannerId:
      name: id
      in: path
      required: true
      description: Hero banner ID
      schema:
        type: integer
        description: Numeric article ID used in /articles/{id}-{slug}.
    MediaId:
      name: id
      in: path
      required: true
      description: Media ID
      schema:
        type: integer
        description: Numeric article ID used in /articles/{id}-{slug}.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page number; defaults to 1.
    Limit:
      name: limit
      in: query
      required: false
      description: Requested number of results per page. Defaults to 10 if omitted. The server clamps integer values below 5 to 5 and above 100 to 100; response pageSize reports the effective value. Invalid/non-integer values return 400.
      schema:
        type: integer
        default: 10
      examples:
        belowMinimum:
          value: 2
        default:
          value: 10
        aboveMaximum:
          value: 150
    AuthorId:
      name: id
      in: path
      required: true
      description: Numeric author identifier; -1 is the protected Unknown author.
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid request; exact JSON error response pending mentor discussion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDraft'
      x-design-status: proposed
    NotFound:
      description: Resource not found; exact JSON error response pending mentor discussion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDraft'
      x-design-status: proposed
  schemas:
    ArticleStatus:
      type: string
      enum:
      - draft
      - published
      maxLength: 20
    PlateContent:
      description: Structured Plate editor JSON. Exact node types and custom blocks must be finalized from the chosen Plate configuration.
      type: array
      items:
        type: object
        additionalProperties: true
    ArticlePreview:
      description: Distinct image and body; not simply excerpted from full article.
      type: object
      properties:
        imageId:
          type: integer
          description: Numeric article ID used in /articles/{id}-{slug}.
        content:
          $ref: '#/components/schemas/PlateContent'
      required:
      - imageId
      - content
    Article:
      description: Article with its distinct preview; both saved and published atomically. Backend-generated identifier, timestamps and activation flag on create. Author attribution is stored as authorId (numeric reference to Author). An inactive record has status=null and publishedAt=null. Only an active published record has publishedAt set.
      type: object
      properties:
        id:
          type: integer
          description: Numeric article ID used in /articles/{id}-{slug}.
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          description: Globally unique across all articles, including inactive records; slug changes do not create redirects. Used in the React URL /articles/{id}-{slug}; API lookup uses ID.
          maxLength: 255
        authorId:
          type: integer
          description: References CMS Author ID; -1 is the protected Unknown author.
        categoryId:
          type: integer
          description: Numeric category ID; -1 is the protected Unknown category.
        mainImageId:
          type: integer
          description: Numeric media ID referencing an item in the Media Library.
        content:
          $ref: '#/components/schemas/PlateContent'
        preview:
          $ref: '#/components/schemas/ArticlePreview'
        status:
          oneOf:
          - $ref: '#/components/schemas/ArticleStatus'
          - type: 'null'
          description: Null if inactive; draft or published only when isActive=true.
        isActive:
          type: boolean
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: First publication time in current activation cycle; null for draft or inactive content. Unchanged by further Publish updates; cleared on deactivation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - slug
      - authorId
      - categoryId
      - mainImageId
      - content
      - preview
      - status
      - isActive
      - createdAt
      - updatedAt
      - publishedAt
    ArticleInput:
      description: Complete article + embedded preview with desired status (draft or published). Same mandatory fields for both. Backend generates id, createdAt, updatedAt and isActive on creation. mainImageId is required even for drafts. Author is selected using numeric authorId, not free-text author.
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
        authorId:
          type: integer
          description: References CMS Author ID; -1 is the protected Unknown author.
        categoryId:
          type: integer
          description: Numeric category ID; -1 is the protected Unknown category.
        mainImageId:
          type: integer
          description: Numeric media ID referencing an item in the Media Library.
        content:
          $ref: '#/components/schemas/PlateContent'
        preview:
          $ref: '#/components/schemas/ArticlePreview'
        status:
          $ref: '#/components/schemas/ArticleStatus'
      required:
      - title
      - slug
      - authorId
      - categoryId
      - mainImageId
      - content
      - preview
      - status
    Category:
      type: object
      properties:
        id:
          type: integer
          description: Numeric category ID; -1 is the protected Unknown category.
        name:
          type: string
          maxLength: 255
        isSystem:
          type: boolean
          description: True for protected Unknown category; proposed response field.
      required:
      - id
      - name
      - isSystem
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
      required:
      - name
    HeroBanner:
      type: object
      properties:
        id:
          type: integer
          description: Numeric article ID used in /articles/{id}-{slug}.
        imageId:
          type: integer
          description: Numeric article ID used in /articles/{id}-{slug}.
        content:
          $ref: '#/components/schemas/PlateContent'
        status:
          oneOf:
          - $ref: '#/components/schemas/ArticleStatus'
          - type: 'null'
          description: Null if inactive; draft or published only when isActive=true.
        isActive:
          type: boolean
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: First publication time in current activation cycle; null for draft or inactive content. Unchanged by further Publish updates; cleared on deactivation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - imageId
      - content
      - status
      - isActive
      - publishedAt
      description: An inactive record has status=null and publishedAt=null. Only an active published record has publishedAt set.
    HeroBannerInput:
      type: object
      properties:
        imageId:
          type: integer
          description: Numeric article ID used in /articles/{id}-{slug}.
        content:
          $ref: '#/components/schemas/PlateContent'
        status:
          $ref: '#/components/schemas/ArticleStatus'
      required:
      - imageId
      - content
      - status
      description: Status selected via Save draft or Publish. Backend generates id, timestamps and isActive on creation.
    Media:
      type: object
      properties:
        id:
          type: integer
          description: Backend-generated numeric media identifier.
        fileName:
          type: string
          maxLength: 255
        mediaType:
          type: string
          enum:
          - image
          - video
          - audio
          maxLength: 20
        url:
          type: string
          format: uri
          description: External provider URL supplied through Add New Media form.
          maxLength: 2048
      required:
      - id
      - fileName
      - mediaType
      - url
      additionalProperties: false
    PublicArticleCard:
      type: object
      properties:
        articleId:
          type: integer
          description: Numeric article ID used in /articles/{id}-{slug}.
        slug:
          type: string
          description: Current article slug for generating the public URL /articles/{id}-{slug}, not an API lookup key.
          maxLength: 255
        title:
          type: string
          maxLength: 255
        authorId:
          type: integer
          description: Numeric ID of author referenced by the article.
        authorName:
          type: string
          description: Resolved author display name, including Unknown if authorId=-1.
          maxLength: 255
        category:
          $ref: '#/components/schemas/Category'
        mainImageId:
          type: integer
          description: Numeric article ID used in /articles/{id}-{slug}.
        preview:
          $ref: '#/components/schemas/ArticlePreview'
      required:
      - articleId
      - slug
      - title
      - authorId
      - category
      - preview
      - authorName
      description: Data for one public homepage card. All cards represent active published articles; preview content and image are independent of the full article.
    PageArticles:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 5
          maximum: 100
          description: Effective per-page limit, after clamping the requested limit to [5, 100].
      required:
      - articles
      - total
      - page
      - pageSize
      description: Default limit 10; minimum effective limit 5, maximum effective limit 100. An empty result set returns the array as [] and total=0 with HTTP 200.
    PageBanners:
      type: object
      properties:
        banners:
          type: array
          items:
            $ref: '#/components/schemas/HeroBanner'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 5
          maximum: 100
          description: Effective per-page limit, after clamping the requested limit to [5, 100].
      required:
      - banners
      - total
      - page
      - pageSize
      description: Default limit 10; minimum effective limit 5, maximum effective limit 100. An empty result set returns the array as [] and total=0 with HTTP 200. The response array is named banners.
    PageMedia:
      type: object
      properties:
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 5
          maximum: 100
          description: Effective per-page limit, after clamping the requested limit to [5, 100].
      required:
      - media
      - total
      - page
      - pageSize
      description: Default limit 10; minimum effective limit 5, maximum effective limit 100. An empty result set returns the array as [] and total=0 with HTTP 200.
    PagePublicArticleCards:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/PublicArticleCard'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 5
          maximum: 100
          description: Effective per-page limit, after clamping the requested limit to [5, 100].
      required:
      - articles
      - total
      - page
      - pageSize
      description: Homepage cards, ordered by newest published first. Pagination is applied after optional category filtering. Default limit 10; minimum effective limit 5, maximum effective limit 100. An empty result set returns the array as [] and total=0 with HTTP 200.
    ErrorDraft:
      description: Placeholder error contract, NOT approved; RFC 9457 is an option.
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          description: Proposed; exact error format to discuss with mentor.
      required:
      - message
    ArticleEnvelope:
      type: object
      properties:
        article:
          $ref: '#/components/schemas/Article'
      required:
      - article
      additionalProperties: false
    RestoreRequest:
      type: object
      properties:
        status:
          type: string
          const: draft
        isActive:
          type: boolean
          const: true
      required:
      - status
      - isActive
      additionalProperties: false
      description: Restore inactive resource to active draft. Backend clears publishedAt to null; all other content fields remain unchanged.
    HeroBannerEnvelope:
      type: object
      properties:
        banner:
          $ref: '#/components/schemas/HeroBanner'
      required:
      - banner
      additionalProperties: false
    MediaInput:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 255
        mediaType:
          type: string
          enum:
          - image
          - video
          - audio
          maxLength: 20
        url:
          type: string
          format: uri
          maxLength: 2048
      required:
      - fileName
      - mediaType
      - url
      additionalProperties: false
      description: Media ID provisionally generated by backend; confirm with mentor. No binary upload to this endpoint.
    Author:
      type: object
      description: An author record. Unknown has id=-1 and cannot be renamed or deleted. Names are unique case-insensitively after trimming surrounding whitespace.
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
          description: Author name. Trim leading/trailing whitespace before persisting and checking uniqueness; reject names that compare equal ignoring case after trimming.
          maxLength: 255
      required:
      - id
      - name
    AuthorInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Author name. Trim leading/trailing whitespace before persisting and checking uniqueness; reject names that compare equal ignoring case after trimming.
          maxLength: 255
      required:
      - name
      additionalProperties: false
    PublicArticleDetail:
      description: Published active Article fields plus a resolved authorName for public rendering.
      allOf:
      - $ref: '#/components/schemas/Article'
      - type: object
        properties:
          authorName:
            type: string
            description: Display name resolved from authorId.
        required:
        - authorName
paths:
  /api/cms/articles:
    get:
      tags:
      - CMS Articles
      operationId: listCmsArticles
      summary: List articles, including drafts and inactive
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ArticleStatus'
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: categoryId
        in: query
        schema:
          type: integer
          description: Numeric category ID; -1 is the protected Unknown category.
      - name: fromDate
        in: query
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        schema:
          type: string
          format: date
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - oldest
          default: newest
        description: Sort order; defaults to newest.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageArticles'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-design-status: proposed
      description: ' Pagination uses optional limit (default=10, clamp to [5,100]) and 1-based page (default=1). Empty list returns HTTP 200 with an empty array.'
    post:
      tags:
      - CMS Articles
      operationId: createArticle
      summary: Create article and preview together as draft or published
      description: Complete article payload with preview and status. The backend derives Save draft vs Publish from status. Article and preview are saved/published atomically. Published articles cannot be downgraded to draft through PUT; only active articles may be edited. For a new draft, publishedAt=null; initial Publish sets publishedAt to the current timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: Article and preview saved together; backend sets generated fields on creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
  /api/cms/articles/{id}:
    get:
      tags:
      - CMS Articles
      operationId: getCmsArticle
      summary: Get article with preview for editing
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
    put:
      tags:
      - CMS Articles
      operationId: updateArticle
      summary: Update full article and preview together
      description: Complete article payload with preview and status. The backend derives Save draft vs Publish from status. Article and preview are saved/published atomically. Published articles cannot be downgraded to draft through PUT; only active articles may be edited. Publishing an already published active record preserves its publishedAt timestamp.
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Article and preview saved together; backend sets generated fields on creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
    patch:
      tags:
      - CMS Articles
      operationId: restoreArticle
      summary: Reactivate article as draft
      description: Sets isActive=true and status=draft for entire article+preview publication unit. Article must be active before editing. Response is the complete flat resource, not wrapped. publishedAt is null on restoration.
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Complete, flat article restored as active draft (status=draft, publishedAt=null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
    delete:
      tags:
      - CMS Articles
      operationId: deactivateArticle
      summary: Soft-delete article and hide its preview
      description: Retains article and preview data. Public endpoints never expose inactive articles. Deactivation sets isActive=false, status=null, publishedAt=null.
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Article set to isActive=false, preview hidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                required:
                - success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
  /api/cms/categories:
    get:
      tags:
      - CMS Categories
      operationId: listCategories
      summary: List categories including Unknown
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-design-status: proposed
    post:
      tags:
      - CMS Categories
      operationId: createCategory
      summary: Create category (no slug)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
  /api/cms/categories/{id}:
    put:
      tags:
      - CMS Categories
      operationId: updateCategory
      summary: Rename category
      description: Protected Unknown category cannot be renamed.
      parameters:
      - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
    delete:
      tags:
      - CMS Categories
      operationId: deleteCategory
      summary: Delete category and reassign its articles to Unknown
      description: Unknown category cannot be deleted. Reassignment and deletion should be one atomic operation.
      parameters:
      - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category deleted; affected articles reassigned to Unknown
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                required:
                - success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
  /api/cms/authors:
    get:
      tags:
      - CMS Authors
      operationId: listAuthors
      summary: List authors including protected Unknown (no pagination)
      responses:
        '200':
          description: Unpaginated author list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-design-status: proposed
    post:
      tags:
      - CMS Authors
      operationId: createAuthor
      summary: Create author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-design-status: proposed
      description: Trim surrounding whitespace and enforce case-insensitive uniqueness; duplicate or blank name is a validation error (400).
  /api/cms/authors/{id}:
    put:
      tags:
      - CMS Authors
      operationId: updateAuthor
      summary: Rename author
      description: Protected Unknown author (id=-1) cannot be renamed. Trim surrounding whitespace and enforce case-insensitive uniqueness; invalid/duplicate names return 400.
      parameters:
      - $ref: '#/components/parameters/AuthorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
    delete:
      tags:
      - CMS Authors
      operationId: deleteAuthor
      summary: Delete author and reassign their articles to Unknown
      description: Protected Unknown author (id=-1) cannot be deleted. Reassign all articles referencing the deleted author to authorId=-1 and delete the author in one atomic database operation.
      parameters:
      - $ref: '#/components/parameters/AuthorId'
      responses:
        '200':
          description: Author deleted and affected articles reassigned to Unknown
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                required:
                - success
        '400':
