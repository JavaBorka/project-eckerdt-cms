  /api/public/articles:
    get:
      tags:
      - Public Content
      operationId: listPublicArticles
      summary: List public homepage article cards, newest published first
      description: Returns only active published articles and their separately authored previews, ordered by publication date descending (newest first). When categoryId is omitted, articles from all categories are returned. When categoryId is supplied, the backend filters to that category before paginating. The limit request / pageSize response convention applies. Pagination uses optional limit (default=10, clamp to [5,100]) and 1-based page (default=1). Empty list returns HTTP 200 with an empty array.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: categoryId
        in: query
        schema:
          type: integer
          description: Numeric category ID; -1 is the protected Unknown category.
        description: Optional category filter. Omit entirely to show all categories on the homepage.
      responses:
        '200':
          description: Paginated cards sorted by newest publication date first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePublicArticleCards'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-design-status: proposed
  /api/public/articles/{id}:
    get:
      tags:
      - Public Content
      operationId: getPublicArticle
      summary: Get an active published article by stable ID
      description: The public React Router URL is `/articles/{id}-{slug}` (e.g., `/articles/12-my-article`). React extracts the ID and requests `/api/public/articles/{id}`. Returns 404 for draft, inactive, or missing articles. The returned article includes its full content and main image reference. Article slug changes do not create server redirects. Handling outdated slugs in the React URL is intentionally left for mentor review.
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      x-design-status: proposed
