      summary: List public category labels
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-design-status: proposed
      description: Read-only category labels/IDs for homepage category filter navigation. The About the Author page is static React content.
  /api/public/hero-banner:
